
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F5FC">

  <title>404 | Página não encontrada — Noema</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #F7F5FC;
      color: #252536;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .logo {
      position: absolute;
      top: 36px;
      left: 7%;
      color: #252536;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -1.5px;
      text-decoration: none;
    }

    .error-content {
      width: 100%;
      max-width: 620px;
    }

    .error-code {
      margin-bottom: 12px;
      color: #7665D8;
      font-size: clamp(100px, 20vw, 170px);
      font-weight: 800;
      letter-spacing: -12px;
      line-height: 1;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 18px;
      color: #7665D8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(27px, 5vw, 38px);
      letter-spacing: -1px;
    }

    p {
      max-width: 460px;
      margin: 0 auto;
      color: #777486;
      font-size: 16px;
      line-height: 1.8;
    }

    .home-button {
      display: inline-block;
      margin-top: 34px;
      padding: 15px 28px;
      border-radius: 9px;
      background: #7665D8;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .home-button:hover {
      background: #6251C1;
      transform: translateY(-2px);
    }

    footer {
      position: absolute;
      bottom: 28px;
      color: #9995A5;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .logo {
        top: 24px;
        left: 24px;
      }

      .error-code {
        letter-spacing: -7px;
      }

      footer {
        position: static;
        margin-top: 70px;
      }
    }
  </style>
</head>

<body>

  <a href="/" class="logo">noema.</a>

  <main class="error-content">
    <div class="error-code">404</div>

    <span class="eyebrow">CONEXÃO NÃO ENCONTRADA</span>

    <h1>Parece que esta conexão se perdeu.</h1>

    <p>
      A página que você procura não foi encontrada.
      Mas não se preocupe: seu caminho pelo conhecimento
      ainda pode continuar.
    </p>

    <a href="/" class="home-button">
      Voltar para o início
    </a>
  </main>

  <footer>
    © 2026 Noema. Todos os direitos reservados.
  </footer>

</body>
</html>
